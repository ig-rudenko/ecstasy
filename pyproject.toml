[project]
name = "ecstasy"
version = "20.0.11"
description = "Ecstasy - Equipment Control System To Assist You - программа для управления сетевым оборудованием."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alive-progress>=3.3.0",
    "celery>=5.6.3",
    "django>=6.0.8,<6.1",
    "django-celery-beat>=2.8.1",
    "django-cors-headers>=4.9.0",
    "django-dbbackup>=5.3.0",
    "django-filter>=26.1",
    "django-import-export>=4.4.1",
    "django-debug-toolbar>=7.0.0",
    "django-unfold>=0.101.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-orjson-renderer>=1.8.0",
    "drf-yasg>=1.21.15",
    "flask>=3.1.3",
    "flower>=2.0.1",
    "gevent>=26.7.0",
    "gunicorn>=26.0.0",
    "jinja2>=3.1.6",
    "mozilla-django-oidc>=5.0.2",
    "mysqlclient>=2.2.8",
    "openpyxl>=3.1.5",
    "orjson>=3.11.9",
    "paramiko>=5.0.0",
    "pexpect>=4.9.0",
    "pillow>=12.3.0",
    "ping3>=4.0.8",
    "pyyaml>=6.0.3",
    "pyzabbix>=1.3.1",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "textfsm>=2.1.0",
    "urllib3>=2.7.0",
    "xlwt>=1.3.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.15.3",
    "celery-types>=0.26.0",
    "django-extensions>=4.1",
    "django-stubs>=6.0.8",
    "djangorestframework-stubs>=3.17.0",
    "drf-yasg-stubs>=0.1.4",
    "mypy>=2.3.0",
    "pdoc>=15.0.2",
    "ruff>=0.16.0",
    "types-paramiko>=5.0.0.20260724",
    "types-pexpect>=4.9.0.20260518",
    "types-tabulate>=0.10.0.20260508",
    "types-requests>=2.33.0.20260712",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C", # mccabe
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "RSE", # flake8-raise
    "UP", # pyupgrade
    "W", # pycodestyle
]
ignore = [
    "C408", # Unnecessary collection call
    "C901", # Functions with a high complexity
    "E402", # Module level import not at top of file
    "E501", # Line too long
    "SIM108", # Use ternary operator instead of `if`-`else`-block
    "W291", # Trailing whitespace
    "W293", # Blank line contains whitespace
]

[tool.mypy]
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "ecstasy_project.settings"

[tool.black]
line-length = 110
target-version = ["py312"]
